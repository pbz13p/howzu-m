<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>好租 Howzu · 墨尔本在租房源</title>
<link rel="icon" href="favicon.ico" sizes="32x32"><link rel="icon" href="icons/icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0f6b4f"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="好租"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="好租 Howzu 墨尔本在租房源：CBD、Carlton 公寓，房东直租管理，中文服务。每套房一键查对口学区。">
<link rel="stylesheet" href="css/site.css?v=20261107">
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1d2321;--muted:#6b726f;--line:#e4e1d8;--accent:#0f6b4f;--accent2:#e8f3ee;--warn:#9a5b00;--warnbg:#fff6e5}
*{box-sizing:border-box}
body{margin:0;background:#fff!important;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.55}
main{max-width:2200px;margin:0 auto;padding:24px clamp(16px,4.2vw,80px)}
#list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:40px 24px}
@media (min-width:950px){#list{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:1128px){#list{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (min-width:1640px){#list{grid-template-columns:repeat(5,minmax(0,1fr))}}
@media (min-width:1880px){#list{grid-template-columns:repeat(6,minmax(0,1fr))}}
@media (max-width:560px){#list{grid-template-columns:1fr;gap:28px}}
#list .card{margin:0;background:none;border:0;border-radius:0;overflow:visible;cursor:pointer}
#list .empty{grid-column:1/-1}
#list .ph{aspect-ratio:20/19;border-radius:14px;overflow:hidden;position:relative;background:#eee}
#list .sl{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;scroll-behavior:smooth}
#list .sl::-webkit-scrollbar{display:none}
#list .sl img{position:static;flex:0 0 100%;width:100%;height:100%;object-fit:cover;scroll-snap-align:start}
#list .noph{flex:1;display:flex;align-items:center;justify-content:center;color:var(--muted)}
#list .dots{position:absolute;bottom:10px;left:0;right:0;display:flex;justify-content:center;gap:5px;pointer-events:none}
#list .dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.6)}
#list .dots i.on{background:#fff}
#list .cnav{position:absolute;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:50%;border:0;background:rgba(255,255,255,.92);font-size:20px;line-height:1;cursor:pointer;opacity:0;transition:opacity .2s;box-shadow:0 1px 4px rgba(0,0,0,.2)}
#list .cnav.l{left:10px}#list .cnav.r{right:10px}
#list .card:hover .cnav{opacity:1}
@media (hover:none){#list .cnav{display:none}}
#list .badge{position:absolute;top:12px;left:12px;background:#fff;color:#222;font-size:12px;font-weight:600;padding:4px 10px;border-radius:14px;box-shadow:0 1px 4px rgba(0,0,0,.12)}
#list .badge.draft{background:#fde8e8;color:#a12b2b;top:44px}
#list .body{padding:10px 2px 0}
#list .t{font-size:15px;font-weight:600;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#list .sub{font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#list .price{font-size:15px;color:var(--ink);font-weight:400;margin-top:4px}
#list .price b{font-weight:600}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.filters button{font-size:13px;padding:7px 12px;border:0;border-radius:20px;background:#fff;color:var(--ink);cursor:pointer;border:1px solid var(--line)}
.filters button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:14px;overflow:hidden}
.ph{aspect-ratio:16/10;overflow:hidden;background:linear-gradient(135deg,#dfe9e4,#f1ede4);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px;position:relative}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.ph .n{position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.55);color:#fff;font-size:12px;padding:2px 8px;border-radius:10px}
.strip{display:flex;gap:4px;overflow-x:auto;padding:4px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.strip img{height:64px;width:86px;flex:none;object-fit:cover;border-radius:6px;cursor:pointer}
.body{padding:14px 16px}
.price{font-size:22px;font-weight:700;color:var(--accent)}
.price small{font-size:13px;color:var(--muted);font-weight:400}
.t{font-size:17px;font-weight:600;margin:2px 0}
.addr{font-size:13px;color:var(--muted)}
.facts{display:flex;gap:14px;margin:8px 0;font-size:14px}
.tags{margin:6px 0}
.tag{display:inline-block;font-size:12px;padding:2px 9px;border-radius:20px;background:var(--accent2);color:var(--accent);margin:0 4px 4px 0}
.tag.when{background:var(--warnbg);color:var(--warn)}
.tag.draft{background:#fde8e8;color:#a12b2b}
.desc{font-size:14px;margin:6px 0;white-space:pre-wrap}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn{font-size:14px;padding:10px 14px;border-radius:10px;background:var(--accent);color:#fff;text-decoration:none;border:0;cursor:pointer}

#list .card{cursor:pointer}
.more{font-size:13px;color:#6b726f;margin:8px 0 2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.more b{color:#0f6b4f;font-weight:600}
.dt-mask{position:fixed;inset:0;z-index:90;background:rgba(10,16,14,.6);display:flex;align-items:center;justify-content:center;padding:24px}
.dt{position:relative;background:#fff;border-radius:18px;width:min(980px,100%);max-height:100%;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.dt-x{position:absolute;top:12px;right:12px;z-index:3;width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.95);font-size:18px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.dt-g{position:relative;background:#111;aspect-ratio:16/10;display:flex;align-items:center;justify-content:center}
.dt-g img{width:100%;height:100%;object-fit:contain}
.dt-none{color:#aaa}
.dt-nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.9);font-size:26px;line-height:1;cursor:pointer;color:#1d2321}
.dt-nav.l{left:12px}.dt-nav.r{right:12px}
.dt-c{position:absolute;bottom:10px;right:12px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;padding:2px 9px;border-radius:10px}
.dt-th{display:flex;gap:6px;overflow-x:auto;padding:8px;scrollbar-width:none;background:#f6f4ef}
.dt-th::-webkit-scrollbar{display:none}
.dt-th img{height:62px;width:84px;flex:none;object-fit:cover;border-radius:8px;cursor:pointer;opacity:.55;border:2px solid transparent}
.dt-th img.on{opacity:1;border-color:#0f6b4f}
.dt-b{padding:18px 22px 24px}
.dt-b h2{margin:4px 0 2px;font-size:22px}
.dt-desc{white-space:pre-wrap;font-size:15px;line-height:1.75;margin:14px 0 6px;color:#2b322f;border-top:1px solid #e4e1d8;padding-top:14px}
.dt-desc.muted{color:#6b726f}
@media (max-width:720px){.dt-mask{padding:0}.dt{border-radius:0;height:100%;max-height:none}.dt-g{aspect-ratio:4/3}.dt-b{padding:14px 16px 90px}.dt-b .acts{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #e4e1d8;padding:10px 12px calc(10px + env(safe-area-inset-bottom));margin:0;overflow-x:auto}}
.sharefab{position:absolute;top:10px;right:10px;z-index:2;border:0;border-radius:20px;padding:6px 12px;background:rgba(255,255,255,.95);color:#222;font-size:13px;font-weight:600;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.sharefab:hover{background:#fff}
.acts{flex-wrap:nowrap}
.acts .btn{white-space:nowrap;padding:10px 12px}
.desk{display:none}
@media (hover:hover) and (pointer:fine){.mob{display:none}.desk{display:inline}}
.btn.ghost{background:var(--accent2);color:var(--accent)}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.note{font-size:12px;color:var(--muted)}
.contact{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 14px;display:none;gap:8px;justify-content:center}
footer{max-width:2200px;margin:0 auto;padding:30px clamp(16px,4.2vw,80px)}
</style>
</head>
<body>
<nav class="nav"><div class="in">
  <a class="logo" href="index.html"><i>好</i>好租 Howzu<small>墨尔本 · 学区 · 租房 · 投资</small></a>
  <div class="links"><a href="index.html">🏫 查学区</a><a href="rentals.html" class="on">🏠 在租房源</a><a href="invest.html">📈 投资测算</a></div>
  <a class="post" href="post.html">＋ 免费发房源</a>
</div></nav>
<header class="hero"><div class="in"><h1>在租房源</h1><p>墨尔本 CBD / Carlton 公寓，我们直接管理，中文沟通，看房、签约、维修一条龙。房东和转租的朋友也可以 <a href="post.html" style="font-weight:600">免费发房源</a>。</p></div></header>
<main>
  <div class="filters" id="filters">
    <button data-f="all" class="on">全部</button>
    <button data-f="now">马上入住</button>
    <button data-f="later">稍后入住</button>
    <button data-f="1">1 房</button>
    <button data-f="2">2 房+</button>
  </div>
  <div id="list"><div class="empty">加载中…</div></div>
  <p class="note">房源信息以签约时为准。租约使用维州 CAV 标准租赁合同，押金存入 RTBA（维州租房押金管理局）。</p>
</main>
<div class="contact" id="contactBar"></div>
<footer class="note">好租 Howzu · Cendant Property 管理</footer>
<script src="js/config.js?v=20261107"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script src="js/share.js?v=20261107g"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const preview=new URLSearchParams(location.search).has("preview");
let L=[],C={},F="all";
const isNow=x=>/尽快|马上|即|now/i.test(x.available||"");
function card(x){
  const P=x.photos||[];
  const imgs=P.length?P.map((p,i)=>`<img src="${esc(p)}" alt="${esc(x.title)}" loading="${i?"lazy":"eager"}">`).join(""):`<div class="noph">照片整理中</div>`;
  const dots=P.length>1?`<div class="dots">${P.slice(0,5).map((_,i)=>`<i class="${i?"":"on"}"></i>`).join("")}</div><button class="cnav l" data-cnav="-1" aria-label="上一张">‹</button><button class="cnav r" data-cnav="1" aria-label="下一张">›</button>`:"";
  const price=x.rentWeekly?`<b>$${x.rentWeekly}</b> / 周`:`<b>租金面议</b>`;
  const area=(x.address||"").split(",").slice(-1)[0].replace(/VIC\s*\d+/,"").trim()||"墨尔本";
  const f=[x.beds!=null?`${x.beds} 房`:"",x.baths!=null?`${x.baths} 卫`:"",x.cars?`${x.cars} 车位`:""].filter(Boolean).join(" · ");
  const when=isNow(x)?"可马上入住":(x.available||"")+"入住";
  return `<div class="card" id="L-${esc(x.id)}" data-open="${esc(x.id)}">
    <div class="ph"><div class="sl">${imgs}</div>${dots}
      ${isNow(x)?'<span class="badge">马上入住</span>':""}${x.status!=="live"?'<span class="badge draft">草稿·未公开</span>':""}
      <button class="sharefab" data-share="${esc(x.id)}" title="分享到微信、小红书" aria-label="分享">分享</button></div>
    <div class="body"><div class="t">${esc(x.title)}</div>
      <div class="sub">${esc(area)}${f?" · "+f:""}</div>
      <div class="sub">${esc(when)}</div>
      <div class="price">${price}</div></div></div>`;
}
const one=new URLSearchParams(location.search).get("id");
document.addEventListener("scroll",e=>{const sl=e.target;if(!sl.classList||!sl.classList.contains("sl"))return;const n=sl.children.length,i=Math.round(sl.scrollLeft/(sl.clientWidth||1));const d=sl.parentNode.querySelectorAll(".dots i");if(!d.length)return;const k=n<=5?i:Math.min(4,Math.max(0,i<2?i:i>=n-2?5-(n-i):2));d.forEach((el,j)=>el.classList.toggle("on",j===k));},true);
function render(){
  let list=L.filter(x=>preview||x.status==="live"||x.id===one);
  list=list.filter(x=>F==="all"||(F==="now"&&isNow(x))||(F==="later"&&!isNow(x))||(F==="1"&&x.beds===1)||(F==="2"&&x.beds>=2));
  $("#list").innerHTML=list.length?list.map(card).join(""):`<div class="empty">暂时没有符合条件的房源。<br>想第一时间收到新房源？在<a href="index.html#leadCard">学区页</a>留下需求。</div>`;
}

/* ---------- 房源详情 ---------- */
let DX=null,DI=0;
function contactBtns(x){const msg=encodeURIComponent(`你好，我在好租 Howzu 看到房源：${x.title}`);const tel=x.phone||C.phone,wx=x.wechat||C.wechat;const telTxt=tel?String(tel).replace(/^(\d{4})(\d{3})(\d{3})$/,"$1 $2 $3"):"";
  return (tel?`<a class="btn mob" href="sms:${esc(tel)}?&body=${msg}">💬 发短信</a><a class="btn" href="tel:${esc(tel)}">📞 <span class="mob">打电话</span><span class="desk">${esc(telTxt)}</span></a>`:"")+(wx?`<button class="btn ghost" data-wx="${esc(wx)}">微信：${esc(wx)}</button>`:"");}
function openDetail(x,noPush){
  DX=x;DI=0;const P=x.photos||[];
  const f=[x.beds!=null?`🛏 ${x.beds} 房`:"",x.baths!=null?`🛁 ${x.baths} 卫`:"",x.cars!=null?`🚗 ${x.cars?x.cars+" 车位":"无车位"}`:""].filter(Boolean).join("　");
  const m=document.createElement("div");m.className="dt-mask";m.id="dt";
  m.innerHTML=`<div class="dt" role="dialog" aria-label="${esc(x.title)}">
   <button class="dt-x" data-close aria-label="关闭">✕</button>
   <div class="dt-g">${P.length?`<img id="dtImg" src="${esc(P[0])}" alt=""><button class="dt-nav l" data-nav="-1" aria-label="上一张">‹</button><button class="dt-nav r" data-nav="1" aria-label="下一张">›</button><span class="dt-c" id="dtC">1 / ${P.length}</span>`:`<div class="dt-none">照片整理中</div>`}</div>
   ${P.length>1?`<div class="dt-th">${P.map((p,i)=>`<img src="${esc(p)}" data-i="${i}" class="${i?"":"on"}" loading="lazy">`).join("")}</div>`:""}
   <div class="dt-b">
    <div class="price">${x.rentWeekly?`$${x.rentWeekly}<small> / 周</small>`:`<small>租金面议</small>`}</div>
    <h2>${esc(x.title)}</h2><div class="addr">📍 ${esc(x.address)}</div>
    ${f?`<div class="facts">${f}</div>`:""}
    <div class="tags"><span class="tag when">${isNow(x)?"🔑 ":"📅 "}${esc(x.available||"")}入住</span>${x.furnished===true?'<span class="tag">带家具</span>':x.furnished===false?'<span class="tag">不带家具</span>':""}${(x.highlights||[]).map(h=>`<span class="tag">${esc(h)}</span>`).join("")}</div>
    ${x.desc?`<div class="dt-desc">${esc(x.desc)}</div>`:`<div class="dt-desc muted">房东还没有写介绍，欢迎直接联系咨询。</div>`}
    <div class="acts">${contactBtns(x)}<a class="btn ghost" href="index.html?q=${encodeURIComponent(x.address)}">🏫 看学区</a><button class="btn ghost" data-share="${esc(x.id)}">📤 分享</button></div>
   </div></div>`;
  document.body.appendChild(m);document.body.style.overflow="hidden";
  if(!noPush)history.pushState({id:x.id},"",`?id=${encodeURIComponent(x.id)}`);
  let sx=null;const g=m.querySelector(".dt-g");
  g.addEventListener("touchstart",e=>{sx=e.touches[0].clientX},{passive:true});
  g.addEventListener("touchend",e=>{if(sx==null)return;const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>40)go(dx<0?1:-1);sx=null;});
}
function go(d){const P=DX.photos||[];if(!P.length)return;DI=(DI+d+P.length)%P.length;show();}
function show(){const P=DX.photos;document.getElementById("dtImg").src=P[DI];const c=document.getElementById("dtC");if(c)c.textContent=`${DI+1} / ${P.length}`;document.querySelectorAll(".dt-th img").forEach((t,i)=>{t.classList.toggle("on",i===DI);if(i===DI)t.scrollIntoView({block:"nearest",inline:"center"});});}
function closeDetail(back){const m=document.getElementById("dt");if(!m)return;m.remove();document.body.style.overflow="";DX=null;if(back!==false&&new URLSearchParams(location.search).get("id"))history.pushState({},"","rentals.html"+(preview?"?preview=1":""));}
addEventListener("popstate",()=>{const id=new URLSearchParams(location.search).get("id");closeDetail(false);if(id){const x=L.find(y=>String(y.id)===id);if(x)openDetail(x,true);}});
addEventListener("keydown",e=>{if(!DX)return;if(e.key==="Escape")closeDetail();if(e.key==="ArrowRight")go(1);if(e.key==="ArrowLeft")go(-1);});
document.addEventListener("click",e=>{
  const t=e.target;
  if(t.closest("#dt")){
    if(t.closest("[data-close]")||t.id==="dt")return closeDetail();
    const n=t.closest("[data-nav]");if(n)return go(+n.dataset.nav);
    const th=t.closest(".dt-th img");if(th){DI=+th.dataset.i;return show();}
    const w=t.closest("[data-wx]");if(w){navigator.clipboard&&navigator.clipboard.writeText(w.dataset.wx);w.textContent="已复制微信号 "+w.dataset.wx;return;}
    return;
  }
  const cn=t.closest("[data-cnav]");if(cn){const sl=cn.parentNode.querySelector(".sl");sl.scrollBy({left:sl.clientWidth*(+cn.dataset.cnav)});return;}
  if(t.closest("a,button,[data-share]"))return;
  const card=t.closest("[data-open]");if(!card)return;
  const x=L.find(y=>String(y.id)===card.dataset.open);if(!x)return;
  const sl=card.querySelector(".sl");const i=sl?Math.round(sl.scrollLeft/(sl.clientWidth||1)):0;
  openDetail(x);if(i){DI=i;show();}
});
document.addEventListener("click",e=>{const b=e.target.closest("[data-share]");if(!b)return;const x=L.find(y=>String(y.id)===b.dataset.share);if(x&&window.HowzuShare)HowzuShare.open(x);});
$("#filters").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;F=b.dataset.f;document.querySelectorAll("#filters button").forEach(x=>x.classList.toggle("on",x===b));render();});
const hideUnit=a=>String(a||"").replace(/^\s*[\w-]+\s*\/\s*/,"");
async function userListings(){
  const H=window.HOWZU||{}; if(!H.SUPABASE_URL) return [];
  try{
    const r=await fetch(`${H.SUPABASE_URL}/rest/v1/listings?status=eq.live&order=created_at.desc&limit=200`,{headers:{apikey:H.SUPABASE_ANON_KEY}});
    const rows=r.ok?await r.json():[];
    return rows.map(x=>({id:x.id,status:"live",title:x.title,address:hideUnit(x.address),suburb:x.suburb,beds:x.beds,baths:x.baths,cars:x.cars,rentWeekly:x.rent_weekly,available:x.available,furnished:x.furnished==="带家具"?true:x.furnished==="不带家具"?false:null,photos:x.photos||[],highlights:x.highlights||[],desc:x.description,phone:x.contact_phone,wechat:x.contact_wechat,user:true}));
  }catch(_){return []}
}
Promise.all([fetch("data/listings.json",{cache:"no-store"}).then(r=>r.json()).catch(()=>({})),userListings()]).then(([j,u])=>{L=[...(j.listings||[]).map(x=>({...x,address:hideUnit(x.address)})),...u];C=j.contact||{};render();if(one){const x=L.find(y=>String(y.id)===one);if(x){if(new URLSearchParams(location.search).has("send")&&window.HowzuShare)HowzuShare.open(x);else openDetail(x,true);}}});
</script>
</body>
</html>
